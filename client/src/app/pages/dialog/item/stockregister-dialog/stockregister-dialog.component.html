<form autocomplete="off">
  <h3 mat-dialog-title>
    <span><i class="material-icons">add_box</i> Add Stock</span>
    <a (click)="closeDialog()" aria-label="Close">
      <mat-icon>close</mat-icon>
    </a>
  </h3>
  <mat-dialog-content>
    <div class="row">
      <div class="col-lg-12 col-xl-12 mb-3">
        <label class="form-label">Shop</label>
        <input
          type="text"
          class="form-control form-control-sm"
          [value]="shopLabel"
          readonly
          tabindex="-1"
        />
      </div>
      <div class="col-lg-12 col-xl-12 mb-3">
        <label class="form-label">Item</label>
        <input
          type="text"
          class="form-control form-control-sm"
          [value]="itemCD + ' - ' + itemName"
          readonly
          tabindex="-1"
        />
      </div>
      <div class="col-lg-12 col-xl-12 mb-3">
        <label class="form-label">Current Balance</label>
        <input
          type="text"
          class="form-control form-control-sm text-end"
          [value]="balance | number : '1.0-0'"
          readonly
          tabindex="-1"
        />
      </div>
      <div class="col-lg-12 col-xl-12 mb-3">
        <label for="txtAddedQty" class="form-label">Added Qty</label>
        <input
          type="number"
          class="form-control form-control-sm text-end"
          id="txtAddedQty"
          [(ngModel)]="addedQty"
          name="addedQty"
          autofocus
        />
      </div>
      <div class="col-lg-12 col-xl-12 mb-3">
        <label class="form-label">New Balance</label>
        <input
          type="text"
          class="form-control form-control-sm text-end"
          [value]="newBalance | number : '1.0-0'"
          readonly
          tabindex="-1"
        />
      </div>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button
      id="btncancel"
      type="button"
      (click)="closeDialog()"
      class="btn w100 btn-dark btn-sm mr5"
    >
      Cancel
    </button>
    <button
      type="button"
      id="btnSaveStock"
      class="btn w100 btn-success btn-sm mr5"
      (click)="save()"
      [disabled]="isSubmitting"
    >
      Save
    </button>
  </mat-dialog-actions>
</form>
